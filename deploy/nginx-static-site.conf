server {
    listen 80;
    listen [::]:80;
    server_name leesidedentalcareltd.co.ke www.leesidedentalcareltd.co.ke;

    # Enable this redirect after a valid SSL certificate exists.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leesidedentalcareltd.co.ke www.leesidedentalcareltd.co.ke;

    root /home/salonik/app/dist;
    index index.html;

    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/leesidedentalcareltd.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leesidedentalcareltd.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:html|json|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
